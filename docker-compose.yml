version: '3.8'

services:
  # Реестр Consul
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - main_network

  # Сервис аутентификации (JWT + bcrypt)
  auth:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth
    environment:
      - INSTANCE_NAME=auth-service-1
      - PORT=8000
      - JWT_SECRET=super-secret-jwt-key-from-env-2026
    depends_on:
      - consul
    networks:
      - main_network

  # Первый инстанс каталога товаров
  catalog-1:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-1
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    depends_on:
      - consul
    networks:
      - main_network

  # Второй инстанс каталога товаров
  catalog-2:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    depends_on:
      - consul
    networks:
      - main_network

  # Микросервис заказов
  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8000"
    environment:
      - INSTANCE_NAME=order-service-1
      - PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - rabbitmq
      - kafka
    networks:
      - main_network

  # Центральный API Gateway (JWT validation + Rate Limiting)
  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8000"
    environment:
      - JWT_SECRET=super-secret-jwt-key-from-env-2026
    depends_on:
      - auth
      - catalog-1
      - catalog-2
      - order-service
    networks:
      - main_network

  payment-service:
    build: ./payment_service
    container_name: payment-service
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - main_network

  notification-service:
    build: ./notification_service
    container_name: notification-service
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
    networks:
      - main_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - main_network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - main_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - main_network

  analytics_service:
    build:
      context: ./analytics_service
      dockerfile: Dockerfile
    container_name: analytics_service
    ports:
      - "8006:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - main_network

  graphql-gateway:
    build:
      context: ./graphql_gateway
      dockerfile: Dockerfile
    container_name: graphql-gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - catalog-1
      - catalog-2
      - order-service
    networks:
      - main_network

  # Внешний входной балансировщик (Nginx -> API Gateway)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - main_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - main_network

volumes:
  rabbitmq_data:

networks:
  main_network:
    driver: bridge
