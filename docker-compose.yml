version: '3.8'

services:
  # Реестр Consul (Service Discovery)
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - micro_network

  # Cервис аутентификации
  auth:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth
    environment:
      - INSTANCE_NAME=auth-service-1
      - PORT=8000
    depends_on:
      - consul
    networks:
      - micro_network

  # Первый инстанс каталога товаров
  catalog-1:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-1
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    depends_on:
      - consul
    networks:
      - micro_network

  # Второй инстанс каталога товаров
  catalog-2:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    depends_on:
      - consul
    networks:
      - micro_network

  # Шлюз API Gateway и балансировщик (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - micro_network

networks:
  micro_network:
    driver: bridge
