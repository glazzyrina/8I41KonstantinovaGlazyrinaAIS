version: '3.8'

services:
  # Реестр Consul (Service Discovery)
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"


  # Cервис аутентификации
  auth:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth
    environment:
      - INSTANCE_NAME=auth-service-1
      - PORT=8000
    depends_on:
      - consul


  # Первый инстанс каталога товаров
  catalog-1:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-1
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    depends_on:
      - consul


  # Второй инстанс каталога товаров
  catalog-2:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    depends_on:
      - consul


  # Микросервис Заказов 
  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      - INSTANCE_NAME=order-service-1
      - PORT=8000
    depends_on:
      - rabbitmq


  payment-service:
    build: ./payment_service
    container_name: payment-service
    environment:
      - PYTHONUNBUFFERED=1



  notification-service:
    build: ./notification_service
    container_name: notification-service
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq



  graphql-gateway:
    build:
      context: ./graphql_gateway
      dockerfile: Dockerfile
    container_name: graphql-gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - catalog-1
      - catalog-2
      - order-service



  # Шлюз API Gateway и балансировщик (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
      - order-service
      - graphql-gateway


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # Порт для подключения микросервисов (клиентов)
      - "15672:15672"    # Порт для веб-панели управления (Management UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  rabbitmq_data:
