events { worker_connections 1024; }

http {
    upstream catalog_servers {
        server catalog-1:8000;
        server catalog-2:8000;
    }

    server {
        listen 80;

        # Маршрутизация эндпоинтов авторизации
        location /api/auth/ {
            proxy_pass http://auth:8000; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация и балансировка каталога товаров
        location /api/catalog/ {
            proxy_pass http://catalog_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация сервиса заказов
        location /api/orders {
            proxy_pass http://order-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Путь для центрального GraphQL-шлюза
        location /graphql {
            proxy_pass http://graphql-gateway:8000/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}