events { worker_connections 1024; }

http {
    server {
        listen 80;

        resolver 127.0.0.11 valid=5s;

        # Маршрутизация эндпоинтов аутентификации через API Gateway
        location /auth/ {
            set $gateway http://api-gateway:8000;
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация каталога товаров через API Gateway (с проверкой JWT и Rate Limit)
        location /api/catalog/ {
            set $gateway http://api-gateway:8000;
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация сервиса заказов через API Gateway (с проверкой JWT и Rate Limit)
        location /orders {
            set $gateway http://api-gateway:8000;
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger UI самого API Gateway
        location / {
            set $gateway http://api-gateway:8000;
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
