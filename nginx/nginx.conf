events { worker_connections 1024; }

http {
    # Балансировка Catalog-сервиса (из ЛР2)
    upstream catalog_servers {
        server catalog-1:8000;
        server catalog-2:8000;
    }

    server {
        listen 80;

        # =====================================================================
        # ЛАБОРАТОРНАЯ РАБОТА №3: Простая и надежная маршрутизация REST и GraphQL
        # =====================================================================

        # 1. Маршрутизация эндпоинтов авторизации и её Swagger UI
        location /api/auth/ {
            proxy_pass http://auth:8000; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Маршрутизация каталога товаров и его Swagger UI
        location /api/catalog/ {
            proxy_pass http://catalog_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Маршрутизация сервиса заказов и его Swagger UI
        location /api/orders {
            proxy_pass http://order-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Путь для центрального GraphQL-шлюза
        location /graphql {
            proxy_pass http://graphql-gateway:8000/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}