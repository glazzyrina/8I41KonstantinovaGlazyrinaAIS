events { worker_connections 1024; }

http {
    # Балансировка Catalog-сервиса (из ЛР2)
    upstream catalog_servers {
        server catalog-1:8000;
        server catalog-2:8000;
    }

    server {
        listen 80;

        # Включаем внутренний DNS-резолвер Docker. 
        # valid=5s заставляет Nginx обновлять IP-адреса контейнеров каждые 5 секунд.
        resolver 127.0.0.11 valid=5s;

        # Маршрутизация эндпоинтов авторизации и её Swagger UI
        location /api/auth/ {
            proxy_pass http://auth:8000; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация каталога товаров и его Swagger UI
        location /api/catalog/ {
            proxy_pass http://catalog_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # УМНАЯ маршрутизация сервиса заказов через переменную.
        # Запись хоста в переменную $order_service заставляет Nginx игнорировать 
        # отсутствие контейнера при старте и искать его динамически в сети!
        location /api/orders {
            set $order_service http://order-service:8000;
            proxy_pass $order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Путь для центрального GraphQL-шлюза
        location /graphql {
            proxy_pass http://graphql-gateway:8000/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
